name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHE_HOST_DIR: ./.hugo_cache
      HUGO_CACHE_CONTAINER_DIR: /src/.hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.HUGO_CACHE_HOST_DIR }}
          key: hugo-${{ runner.os }}-${{ hashFiles('HUGO_VERSION', 'go.sum', 'package-lock.json') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Build in Docker Compose
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          make render-site
          HUGO_CACHE_CONTAINER_DIR="${HUGO_CACHE_CONTAINER_DIR}"
          RENDER_BASE_URL="${BASE_URL}"

      - name: Save build cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.HUGO_CACHE_HOST_DIR }}
          key: hugo-${{ runner.os }}-${{ hashFiles('HUGO_VERSION', 'go.sum', 'package-lock.json') }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
